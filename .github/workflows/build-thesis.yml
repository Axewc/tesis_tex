name: Compilar Tesis (LaTeX → PDF)

on:
  push:
    branches: [main]
    paths:
      - 'tesis/**'
      - '.github/workflows/build-thesis.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tesis/**'
      - '.github/workflows/build-thesis.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Compilar LaTeX a PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: tesis/tesis.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false

      - name: Subir PDF como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tesis-pdf
          path: tesis/tesis.pdf
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Descargar PDF
        uses: actions/download-artifact@v4.1.7
        with:
          name: tesis-pdf

      - name: Crear/Actualizar release con el PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Última versión de la tesis"
          body: "PDF generado automáticamente desde el último commit en main."
          files: tesis.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
